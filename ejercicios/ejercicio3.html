<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <h1>Ejercicio 3</h1>
    <p id="ejercicio3"></p>
</body>
<script>
    fetch("https://freegeoip.app/json/")
        .then(resp => resp.json())
            .then(datos => {
                let nombre_pais = datos["country_name"];
                let ciudad = datos["city"];
                let c_postal = datos["zip_code"];
                let ip = datos["ip"];
                const lista_completa = [nombre_pais, ciudad,c_postal,ip];
                document.getElementById("ejercicio3").textContent = lista_completa;
            }) 
        .catch(error => console.error("Error al obtener los datos",error));
</script>
</html>
