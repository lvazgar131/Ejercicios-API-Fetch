<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6</title>
    <style>
        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 60%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>

<h2>Ejercicio 6</h2>

<label>Descripción del artículo</label><br>
<input type="text" id="descripcion"><br><br>

<label>Precio</label><br>
<input type="number" id="precio"><br><br>

<button id="btnAgregar">Nuevo artículo</button>

<table id="tabla">
    <thead>
        <tr>
            <th>Código</th>
            <th>Descripción</th>
            <th>Precio</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
const articulos = []; // JSON vacío

const tbody = document.querySelector("#tabla tbody");
const btn = document.getElementById("btnAgregar");

function pintarTabla() {
    tbody.innerHTML = "";
    articulos.forEach(articulo => {
        tbody.innerHTML += `
            <tr>
                <td>${articulo.codigo}</td>
                <td>${articulo.descripcion}</td>
                <td>${articulo.precio}</td>
            </tr>
        `;
    });
}

btn.addEventListener("click", () => {
    const descripcion = document.getElementById("descripcion").value;
    const precio = document.getElementById("precio").value;

    if (descripcion === "" || precio === "") {
        alert("Completa todos los campos");
        return;
    }

    const nuevoArticulo = {
        codigo: articulos.length + 1, // autoincremental
        descripcion: descripcion,
        precio: precio
    };

    articulos.push(nuevoArticulo);
    pintarTabla();

    document.getElementById("descripcion").value = "";
    document.getElementById("precio").value = "";
});
</script>

</body>
</html>
